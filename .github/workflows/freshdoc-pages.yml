name: Freshdoc pilot Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: freshdoc-pilot-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site and exact version proof
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          cp index.html styles.css projects.js _site/
          cp -R docs _site/docs
          python3 - <<'PY'
          import os, json
          with open('_site/version.json', 'w') as f:
              json.dump({'sha': os.environ['DEPLOYED_SHA'], 'environment': 'github-pages'}, f)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
